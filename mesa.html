  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa — CMR Marcenaria</title>
  <meta name="theme-color" content="#120b07">
  <link rel="icon" href="assets/icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="publico">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T62TPHT7"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <header class="topo"><div class="topo-dentro">
    <a href="./" class="marca">
      <img src="assets/logo.jpg" alt="">
      <span class="marca-textos"><span class="marca-nome">CMR Marcenaria</span><span class="marca-sub">Móveis rústicos</span></span>
    </a>
  </div></header>

  <main class="conteudo">
    <a href="./" class="voltar">← Voltar ao catálogo</a>
    <div id="mesa"><p class="dica">Carregando…</p></div>
  </main>

  <footer class="rodape"><div class="rodape-dentro">
    <img src="assets/logo.jpg" alt="">
    <span>CMR Marcenaria · Móveis rústicos em madeira maciça, feitos à mão</span>
    <a href="painel.html" class="link-lojista">Área do lojista</a>
  </div></footer>

  <script src="assets/comum.js?v=202610201400"></script>
  <script>
    const codigo = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
    const alvo = document.getElementById("mesa");

    carregarCatalogo().then((dados) => {
      const m = dados.mesas.find((x) => x.codigo.toUpperCase() === codigo);
      if (!m || m.status === "vendido") {
        alvo.innerHTML = `<div class="vazio">Essa mesa não está mais disponível. <a href="./">Veja as outras mesas do catálogo</a>.</div>`;
        return;
      }
      document.title = `${m.nome} (${m.codigo}) — CMR Marcenaria`;
      const cat = categoriaDe(m.comprimento_cm);
      const site = siteAtual();
      const whats = linkWhatsApp(dados.loja && dados.loja.whatsapp, mensagemInteresse(m, site));
      const linha = (rotulo, valor) => (valor ? `<dt>${rotulo}</dt><dd>${esc(valor)}</dd>` : "");
      const video = videoDaMesa(m);
      // Galeria: fotos e, no fim, o vídeo (se houver)
      const itens = [...m.fotos.map((src) => ({ foto: src })), ...(video ? [{ video }] : [])];
      const conteudo = (item, tocar) => {
        if (item.foto) return `<img src="${esc(item.foto)}" alt="${esc(m.nome)}">`;
        const v = item.video;
        if (v.tipo === "youtube") return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?rel=0&playsinline=1${tocar ? "&autoplay=1" : ""}" title="Vídeo da mesa" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        if (v.tipo === "arquivo") return `<video src="${esc(v.src)}" controls playsinline preload="metadata"${tocar ? " autoplay" : ""}></video>`;
        return `<a class="botao secundario" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">▶ Assistir ao vídeo</a>`;
      };
      const miniatura = (item, i) => {
        if (item.foto) return `<button class="${i === 0 ? "ativa" : ""}" data-i="${i}" aria-label="Foto ${i + 1}"><img src="${esc(item.foto)}" alt="" loading="lazy"></button>`;
        const v = item.video;
        const fundo = v.tipo === "youtube" ? `<img src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="" loading="lazy">`
          : v.tipo === "arquivo" ? `<video src="${esc(v.src)}#t=0.5" muted playsinline preload="metadata"></video>` : "";
        return `<button class="mini-video ${i === 0 ? "ativa" : ""}" data-i="${i}" aria-label="Vídeo">${fundo}<span>▶ Vídeo</span></button>`;
      };

      alvo.innerHTML = `<div class="detalhe">
        <div class="galeria">
          <div class="foto principal" id="principal">${itens[0] ? conteudo(itens[0], false) : "<span>Foto em breve</span>"}</div>
          ${itens.length > 1 ? `<div class="miniaturas">${itens.map(miniatura).join("")}</div>` : ""}
        </div>
        <div class="ficha">
          <span class="codigo">Peça nº ${esc(m.codigo)}</span>
          <h1>${esc(m.nome)}</h1>
          <span class="selo selo-${m.status}">${m.status === "disponivel" ? "Pronta entrega" : STATUS_TEXTO[m.status]}</span>
          ${m.descricao ? `<p style="margin:0">${esc(m.descricao)}</p>` : ""}
          <dl>
            ${linha("Medidas", medidasTexto(m))}
            ${linha("Categoria", cat ? `${cat} (${faixaTexto(cat)})` : "")}
            ${linha("Lugares", m.lugares)}
            ${linha("Madeira", m.madeira)}
          </dl>
          <div class="preco">${precoTexto(m.preco_a_vista)} ${m.preco_a_vista != null ? "<small>à vista</small>" : ""}</div>
          <div class="acoes-mesa">
            ${whats ? `<a class="botao whats" href="${esc(whats)}" data-mesa="${esc(m.codigo)}" target="_blank" rel="noopener noreferrer">Quero comprar esta mesa (WhatsApp)</a>` : ""}
            <button type="button" class="botao secundario" id="btn-compartilhar">Compartilhar link desta mesa</button>
          </div>
        </div>
      </div>`;

      const btnCompartilhar = document.getElementById("btn-compartilhar");
      btnCompartilhar.addEventListener("click", () => compartilharMesa(m, site, btnCompartilhar));

      alvo.querySelectorAll(".miniaturas button").forEach((b) => b.addEventListener("click", () => {
        const item = itens[b.dataset.i];
        if (item.video && item.video.tipo === "link") { window.open(item.video.url, "_blank", "noopener"); return; }
        document.getElementById("principal").innerHTML = conteudo(item, true);
        alvo.querySelectorAll(".miniaturas button").forEach((x) => x.classList.toggle("ativa", x === b));
      }));
    }).catch((e) => { alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; });
  </script>
</body>
</html>
